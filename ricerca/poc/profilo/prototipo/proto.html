<!doctype html><html lang="it" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo · profilo dei volumi</title><link rel="stylesheet" href="../../../../css/style.css">
<style>
/* stili nuovi proposti per css/style.css (vicino a .ts .athpx) */
.ts .vpbar { fill: var(--ink-3); opacity: .5; }
.ts .vpbar.on { fill: var(--amber); opacity: .9; }
.ts .vpcol { fill: none; stroke: var(--rule); }
.ts .vpwin { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.legend .vpk-bar { background: var(--ink-3); opacity: .5; }
.legend .vpk-win { width: 0; height: 10px; border-left: 1px dashed var(--ink-3); background: none; }
.proto-cap { font: 11px var(--f-mono); color: var(--ink-3); margin: 0 0 8px; }
.stack { display: grid; gap: 14px; max-width: 1480px; margin: 0 auto; }
</style></head><body>
<div class="stack" id="root"></div>
<script type="module">
import { esc, fmt, sgnP, dIT, placeTip, bindTip, chartWidth } from '../../../../js/format.js';
import { timeTicks } from '../../../../js/zoom.js';

const DAY = 864e5;
const p2 = (x) => sgnP(x, 2);
const th = (x, d) => { const t = fmt(x, d), i = t.indexOf(','), n = i < 0 ? t : t.slice(0, i); return n.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (i < 0 ? '' : t.slice(i)); };
const pv = (x) => th(x, Math.abs(x) < 10 ? 3 : 2);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (parent) parent.appendChild(e); return e; };
const q = new URLSearchParams(location.search), RANGE = q.get('r') || '10A', ONLY = q.get('m');

const data = await (await fetch('dati.json')).json();
const root = document.getElementById('root');
for (const m of data) {
  if (ONLY && m.id !== ONLY) continue;
  const box = document.createElement('div');
  box.className = 'panel';
  box.innerHTML = `<div class="ph sub"><h3>${esc(m.label)}: prezzo (serie dal ${m.dates[0].slice(0, 4)}), scala logaritmica</h3><span class="ctl"><span class="seg">${['3A', '10A', 'MAX'].map((r) => `<button type="button" aria-pressed="${r === RANGE}">${r}</button>`).join('')}</span></span></div>` +
    `<div class="chart-wrap"><svg class="ts" role="img"></svg><div class="tip" hidden></div></div><div class="legend"></div>`;
  root.appendChild(box);
  draw(box, m);
}
document.body.dataset.ready = '1';

// stessa costruzione di renderAthChart (js/vix-view.js) con in più la colonna del profilo (righe segnate «PROFILO»)
function draw(box, m) {
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), wrap = box.querySelector('.chart-wrap');
  const { dates, close } = m, s = m.stats, n = dates.length, vp = m.vp;
  const W = chartWidth(svg, 1600), narrow = W < 560, L = 8, R = 52, T = 22, PH = narrow ? 200 : 260, B = 20, H = T + PH + B;
  // PROFILO: colonna stretta tra il riquadro del prezzo e i valori dell'asse (8% della larghezza, da 44 a 110 px)
  const GAP = 6, PRW = vp ? Math.round(Math.max(44, Math.min(110, W * 0.08))) : 0, PW = W - L - R - (PRW ? PRW + GAP : 0), XC = L + PW + GAP;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  const tEnd = Date.parse(dates[n - 1]), span = RANGE === '3A' ? 3 : RANGE === '10A' ? 10 : null;
  const t0 = span ? Math.max(Date.parse(dates[0]), tEnd - span * 365.25 * DAY) : Date.parse(dates[0]), t1 = tEnd;
  const inWin = (d) => { const t = Date.parse(d); return t >= t0 && t <= t1; };
  const x = (d) => L + ((Date.parse(d) - t0) / (t1 - t0)) * PW;
  const vis = []; for (let i = 0; i < n; i++) if (close[i] > 0 && inWin(dates[i])) vis.push(close[i]);
  const showRef = inWin(s.refDate) || Date.parse(s.refDate) < t0;
  // PROFILO: la scala comprende anche le fasce del profilo (minimo e massimo dei 12 mesi, poco oltre le chiusure)
  const lo = Math.log(Math.min(...vis, ...(vp ? [vp.lo] : []))) - 0.03, hi = Math.log(Math.max(...vis, ...(vp ? [vp.hi] : []), ...(showRef ? [s.ref] : []))) + 0.03;
  const fy = (v) => T + ((hi - Math.log(v)) / (hi - lo)) * PH;
  el('rect', { x: L, y: T, width: PW, height: PH, class: 'frame' }, svg);
  if (Date.parse(s.from) < t1) {
    const xa = Math.max(L, x(s.from));
    el('rect', { x: xa, y: T, width: Math.max(0, L + PW - xa), height: PH, class: 'athwin' }, svg);
    if (Date.parse(s.from) > t0) { const t = el('text', { x: xa + 4, y: T + PH - 6, class: 'axt' }, svg); t.textContent = narrow ? 'ultimi 3 anni' : `ultimi 3 anni (dal ${dIT(s.from)}): qui si cerca il massimo`; if (xa + 8 + t.getComputedTextLength() > L + PW) t.textContent = 'ultimi 3 anni'; }
  }
  for (const tk of timeTicks(t0, t1, narrow ? 4 : 9)) { const xx = L + ((tk.t - t0) / (t1 - t0)) * PW; el('line', { x1: xx, x2: xx, y1: T, y2: T + PH, class: 'gridl' }, svg); el('text', { x: xx, y: H - 5, class: 'axt', 'text-anchor': 'middle' }, svg).textContent = tk.label; }
  const vals = []; for (let k = Math.floor(lo / Math.LN10) - 1; k <= Math.ceil(hi / Math.LN10) + 1; k++) for (const mm of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8]) vals.push(mm * 10 ** k);
  const inR = vals.filter((v) => Math.log(v) > lo && Math.log(v) < hi), main = inR.filter((v) => [1, 2, 5].includes(+(v / 10 ** Math.floor(Math.log10(v))).toFixed(2)));
  let lastY = Infinity; const ticks = main.length >= 3 ? main : inR;
  const dec = (v) => (Number.isInteger(+v.toFixed(6)) ? 0 : Number.isInteger(+(v * 10).toFixed(6)) ? 1 : 2);
  const lab = (v) => (v >= 1000 ? th(v / 1000, dec(v / 1000)) + 'k' : th(v, dec(v)));
  // PROFILO: le righe della griglia attraversano anche la colonna, così i valori a destra valgono per tutte e due
  for (const v of ticks) { const yv = fy(v); if (lastY - yv < 20) continue; lastY = yv; el('line', { x1: L, x2: L + PW + (PRW ? GAP + PRW : 0), y1: yv, y2: yv, class: 'gridl' }, svg); el('text', { x: W - R + 4, y: yv + 3, class: 'axt' }, svg).textContent = lab(v); }
  let d = '', on = false;
  for (let i = 0; i < n; i++) { if (!(close[i] > 0) || !inWin(dates[i])) { on = false; continue; } d += (on ? 'L' : 'M') + x(dates[i]).toFixed(1) + ' ' + fy(close[i]).toFixed(1); on = true; }
  el('path', { d, class: 'athpx' }, svg);
  if (showRef) { const xa = Math.max(L, x(s.refDate)), yr = fy(s.ref); el('line', { x1: xa, x2: L + PW, y1: yr, y2: yr, class: 'athref' }, svg); if (inWin(s.refDate)) el('circle', { cx: x(s.refDate), cy: yr, r: 3.5, class: 'athtop' }, svg); }
  if (s.cycleLowDate && inWin(s.cycleLowDate)) el('circle', { cx: x(s.cycleLowDate), cy: fy(s.cycleLow), r: 3, class: 'athlow' }, svg);
  el('circle', { cx: x(dates[n - 1]), cy: fy(close[n - 1]), r: 3, class: 'athlast' }, svg);

  // ---------- PROFILO ----------
  let bars = [];
  if (vp) {
    // inizio dei 12 mesi del profilo: linea tratteggiata verticale
    if (inWin(vp.from)) el('line', { x1: x(vp.from), x2: x(vp.from), y1: T, y2: T + PH, class: 'vpwin' }, svg);
    el('rect', { x: XC, y: T, width: PRW, height: PH, class: 'vpcol' }, svg);
    el('text', { x: XC + 2, y: T - 6, class: 'axt' }, svg).textContent = PRW >= 70 ? 'volumi 12 mesi' : 'vol. 12m';
    // fasce unite a gruppi (divisori di 100) finché ognuna è alta almeno 3 px: con 10A o MAX i 12 mesi sono una striscia
    const lr = Math.log(vp.hi / vp.lo), pxBin = (lr / vp.n / (hi - lo)) * PH;
    const k = [1, 2, 4, 5, 10, 20, 25, 50].find((g) => g * pxBin >= 3) || 100, ng = vp.n / k;
    const edge = (i) => vp.lo * Math.exp((lr * i * k) / vp.n);
    for (let g = 0; g < ng; g++) { let sh = 0; for (let i = g * k; i < (g + 1) * k; i++) sh += vp.bp[i]; bars.push({ a: edge(g), b: edge(g + 1), sh: sh / 100 }); }
    const mx = Math.max(...bars.map((b) => b.sh));
    for (const b of bars) {
      const y1 = fy(b.b), y2 = fy(b.a);
      b.y1 = y1; b.y2 = y2;
      b.el = el('rect', { x: XC + 1, y: y1.toFixed(1), width: Math.max(0, ((b.sh / mx) * (PRW - 4))).toFixed(1), height: Math.max(0.6, y2 - y1 - (k * pxBin >= 4 ? 0.8 : 0.3)).toFixed(1), class: 'vpbar' }, svg);
    }
    box.dataset.merge = k; box.dataset.pxbin = (k * pxBin).toFixed(2);
  }
  // riquadro dei valori: sul prezzo come nell'app; sulla colonna la fascia indicata
  const xh = el('line', { x1: 0, x2: 0, y1: T, y2: T + PH, class: 'xhair', visibility: 'hidden' }, svg);
  const hit = el('rect', { x: L, y: T, width: W - L, height: PH, fill: 'transparent' }, svg);
  let i0 = 0; while (i0 < n - 1 && !inWin(dates[i0])) i0++;
  const show = (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    for (const b of bars) b.el.classList.remove('on');
    if (vp && p.x >= XC - GAP / 2) {
      xh.setAttribute('visibility', 'hidden');
      const b = bars.find((z) => p.y >= z.y1 && p.y <= z.y2);
      if (!b) { tip.hidden = true; return; }
      b.el.classList.add('on');
      tip.innerHTML = `<div class="row"><b>Volume degli ultimi 12 mesi</b></div><div class="row"><span>Prezzi da ${pv(b.a)} a ${pv(b.b)}</span><b>${th(b.sh, 1)}%</b></div><div class="note-row">del volume scambiato dal ${dIT(vp.from)} al ${dIT(vp.to)} (${esc(m.volText)})</div>`;
      placeTip(tip, wrap, e, 12);
      return;
    }
    const tq = t0 + ((Math.max(L, Math.min(L + PW, p.x)) - L) / PW) * (t1 - t0);
    let i = i0; while (i + 1 < n && Date.parse(dates[i + 1]) <= tq) i++;
    const xx = x(dates[i]); xh.setAttribute('x1', xx); xh.setAttribute('x2', xx); xh.setAttribute('visibility', 'visible');
    const c = close[i], after = dates[i] >= s.refDate;
    tip.innerHTML = `<div class="row"><b>${dIT(dates[i])}</b><span>${esc(m.label)}</span></div><div class="row"><span>Chiusura</span><b>${pv(c)}</b></div>` + (after ? `<div class="row"><span>Dal massimo dei 3 anni (${dIT(s.refDate)})</span><b>${p2((c / s.ref - 1) * 100)}</b></div>` : '');
    placeTip(tip, wrap, e, 12);
  };
  bindTip(hit, svg, show, () => { xh.setAttribute('visibility', 'hidden'); tip.hidden = true; for (const b of bars) b.el.classList.remove('on'); });
  box.querySelector('.legend').innerHTML = `<span><span class="kl athk-px"></span>${esc(m.label)} (${esc(m.symbol)}), chiusure</span><span><span class="kb athk-win"></span>ultimi 3 anni (dal ${dIT(s.from)})</span><span><span class="kl athk-ref"></span><span class="kd athk-top"></span>massimo di chiusura dei 3 anni: ${pv(s.ref)} il ${dIT(s.refDate)}</span>` +
    (s.cycleLowDate ? `<span><span class="kd athk-low"></span>minimo dopo il massimo: ${pv(s.cycleLow)} il ${dIT(s.cycleLowDate)}</span>` : '') + `<span><span class="kd athk-last"></span>ultima chiusura: ${pv(s.last)} il ${dIT(s.lastDate)}</span>` +
    (vp ? `<span><span class="kb vpk-bar"></span>a destra: volume per fascia di prezzo, dal ${dIT(vp.from)} al ${dIT(vp.to)} (${esc(m.volText)})</span><span><span class="kb vpk-win"></span>inizio dei 12 mesi</span>` : '');
}
</script>
</body></html>
