name: Probe assets (temporanea)

# Verifica una tantum dei simboli Yahoo candidati per i nuovi universi della rotazione.
on:
  push:
    branches: [claude/great-noether-2f1ude]
    paths: [scripts/probe_assets.js, .github/workflows/probe-assets.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/probe_assets.js
