name: Update data

on:
  schedule:
    # Cron in UTC. Una corsa dopo la chiusura USA e due di recupero: Yahoo pubblica
    # alcune chiusure con ore di ritardo e gli script aspettano che i dati siano completi.
    - cron: "40 22 * * 1-5"
    - cron: "20 3 * * 2-6"
    - cron: "40 11 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prezzi da Yahoo Finance
        id: prices
        continue-on-error: true
        run: node scripts/fetch_data.js

      - name: Breadth settoriale S&P 500 e storia ETF
        id: breadth
        continue-on-error: true
        run: node scripts/fetch_breadth.js

      - name: Alert (zona blu, trigger, segnali falliti)
        if: steps.breadth.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_alerts.js

      - name: Commit dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna variazione nei dati."
          else
            ASOF=$(node -p "require('./data/prices.json').asOf || ''")
            BREADTH=$(node -p "require('./data/breadth.json').asOf")
            GLOBAL=$(node -p "(() => { try { return require('./data/prices_global.json').asOf } catch { return '' } })()")
            git commit -m "chore: dati al ${ASOF:-?} (breadth al ${BREADTH}, globali al ${GLOBAL:-?})"
            git pull --rebase
            git push
          fi

      - name: Esito
        if: steps.prices.outcome == 'failure' || steps.breadth.outcome == 'failure'
        run: |
          echo "::error::Aggiornamento incompleto (prezzi: ${{ steps.prices.outcome }}, breadth: ${{ steps.breadth.outcome }})"
          exit 1
