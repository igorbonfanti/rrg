name: Update data

on:
  schedule:
    # Cron in UTC. Una corsa dopo la chiusura USA, una a metà giornata (chiusure asiatiche) e le corse di recupero
    # ogni ora dalle 01:10 alle 06:10: Yahoo pubblica le chiusure USA a ore diverse della notte e GitHub fa partire
    # le corse programmate anche con ore di ritardo. Le corse di recupero si fermano subito se la seduta USA c'è già
    # (scripts/need_update.js, che ha lo stesso testo del cron in RECOVERY).
    - cron: "40 22 * * 1-5"
    - cron: "10 1-6 * * 2-6"
    - cron: "40 11 * * 2-6"
  workflow_dispatch:
    inputs:
      recompute:
        description: "Sedute della breadth degli indici da ricalcolare (5 di solito; fino a 50 dopo una correzione)"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.need.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # l'ultimo main, non il commit di quando la corsa è stata messa in coda: una corsa partita dietro un'altra
          # deve vedere i dati appena pubblicati (il gate per decidere, l'aggiornamento per non andare in conflitto)
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Serve un aggiornamento?
        id: need
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/need_update.js

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # una connessione appesa non deve tenere occupato il gruppo di concorrenza per ore
    timeout-minutes: 45
    steps:
      # azioni fissate per SHA (v5.1.0 e v5.0.0); le credenziali servono solo ai passi che fanno push
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # l'ultimo main, non il commit di quando la corsa è stata messa in coda: una corsa partita dietro un'altra
          # deve vedere i dati appena pubblicati (il gate per decidere, l'aggiornamento per non andare in conflitto)
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Prezzi da Yahoo Finance
        id: prices
        continue-on-error: true
        run: node scripts/fetch_data.js

      - name: Breadth settoriale S&P 500 e storia ETF
        id: breadth
        continue-on-error: true
        run: node scripts/fetch_breadth.js

      - name: Breadth degli indici (pagina Indici)
        id: indices
        continue-on-error: true
        env:
          RECOMPUTE: ${{ inputs.recompute }}
        run: node scripts/fetch_indices.js

      - name: Commit dati aggiornati
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          node scripts/keep_unchanged.js
          # un file troncato (script interrotto durante la scrittura) non si pubblica: resta quello di ieri
          for f in data/*.json data/index_members/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f" || { echo "::error::$f non è JSON valido: tengo la versione pubblicata"; git checkout -- "$f" 2>/dev/null || rm -f "$f"; }
          done
          git add data/ ':!data/alerts.json'
          if git diff --staged --quiet; then
            echo "Nessuna variazione nei dati."
          else
            ASOF=$(node -p "require('./data/prices.json').asOf || ''")
            BREADTH=$(node -p "require('./data/breadth.json').asOf")
            GLOBAL=$(node -p "(() => { try { return require('./data/prices_global.json').asOf } catch { return '' } })()")
            MACRO=$(node -p "(() => { try { return require('./data/prices_macro.json').asOf } catch { return '' } })()")
            INDICES=$(node -p "(() => { try { return require('./data/indices.json').asOf } catch { return '' } })()")
            git commit -m "chore: dati al ${ASOF:-?} (breadth al ${BREADTH}, globali al ${GLOBAL:-?}, asset reali al ${MACRO:-?}, indici al ${INDICES:-?})"
            git pull --rebase
            git push
          fi

      # Telegram dopo la pubblicazione dei dati: se il push fallisce, la corsa dopo non rimanda gli stessi messaggi
      - name: Alert (zona blu, trigger, segnali falliti)
        id: alerts
        if: steps.breadth.outcome == 'success' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_alerts.js

      # anche quando un invio Telegram è fallito: il registro segna i messaggi arrivati e quelli da riprovare
      - name: Commit registro degli alert
        if: steps.alerts.outcome == 'success' || steps.alerts.outcome == 'failure'
        run: |
          git add data/alerts.json
          if git diff --staged --quiet; then
            echo "Registro degli alert invariato."
          else
            git commit -m "chore: registro degli alert al $(node -p "require('./data/alerts.json').checkedThrough || ''")"
            git pull --rebase
            git push
          fi

      - name: Dati fermi da giorni
        id: fresh
        continue-on-error: true
        run: node scripts/check_fresh.js

      - name: Esito
        if: steps.prices.outcome == 'failure' || steps.breadth.outcome == 'failure' || steps.indices.outcome == 'failure' || steps.alerts.outcome == 'failure' || steps.fresh.outcome == 'failure'
        run: |
          echo "::error::Aggiornamento incompleto (prezzi: ${{ steps.prices.outcome }}, breadth: ${{ steps.breadth.outcome }}, indici: ${{ steps.indices.outcome }}, alert: ${{ steps.alerts.outcome }}, freschezza: ${{ steps.fresh.outcome }})"
          exit 1
